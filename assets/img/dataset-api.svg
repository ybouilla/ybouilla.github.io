<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="system-ui, sans-serif" font-size="11" font-weight="600">
  <!-- Dataset API redesign, animated: every 2 s one data source sends a sample through the single Dataset
       abstraction, which hands it to a different ML framework, so each source reaches each framework in turn.
       Dots move with SMIL (it plays inside an <img> tag); the glows are CSS. -->
  <style>
    .src { animation: src 6s ease-out infinite; }
    .dst { animation: dst 6s ease-out infinite; }
    @keyframes src { 0% { fill: #155e75; } 12%, 100% { fill: #0f172a; } }
    @keyframes dst { 0% { fill: #4c1d95; } 12%, 100% { fill: #0f172a; } }
    .i1 { animation-delay: 0s; } .i2 { animation-delay: 2s; } .i3 { animation-delay: 4s; }
    /* Each source i goes to framework i + 1: Images to sklearn, CSV to TF, BIDS to PyTorch */
    .o2 { animation-delay: 1.4s; } .o3 { animation-delay: 3.4s; } .o1 { animation-delay: 5.4s; }

    .ring { opacity: 0; animation: ring 2s ease-out infinite .6s; }
    @keyframes ring { 0% { opacity: .9; } 35%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .dot { display: none; }
    }
  </style>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>

  <rect width="320" height="180" fill="#0b1224"/>
  <g fill="none" stroke="#475569" stroke-width="1.5">
    <path d="M88 40C120 40 120 90 136 90M88 90h48M88 140C120 140 120 90 136 90"/>
    <path d="M216 90C232 90 232 40 250 40M216 90h34M216 90C232 90 232 140 250 140"/>
  </g>
  <g fill="#0f172a" stroke="#22d3ee" stroke-width="1.5">
    <rect class="src i1" x="16" y="26" width="72" height="28" rx="6"/><rect class="src i2" x="16" y="76" width="72" height="28" rx="6"/><rect class="src i3" x="16" y="126" width="72" height="28" rx="6"/>
  </g>
  <g fill="#0f172a" stroke="#a78bfa" stroke-width="1.5">
    <rect class="dst o1" x="250" y="26" width="58" height="28" rx="6"/><rect class="dst o2" x="250" y="76" width="58" height="28" rx="6"/><rect class="dst o3" x="250" y="126" width="58" height="28" rx="6"/>
  </g>
  <rect class="ring" x="131" y="59" width="90" height="62" rx="13" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="136" y="64" width="80" height="52" rx="10" fill="url(#g)"/>

  <!-- Samples: into the Dataset (cyan), then out to a framework (violet) -->
  <g class="dot" fill="#22d3ee">
    <circle r="3.5" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" path="M88 40C120 40 120 90 136 90" keyPoints="0;1;1" keyTimes="0;.1;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.1;.1001;1"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" path="M88 90h48" keyPoints="0;0;1;1" keyTimes="0;.3333;.4333;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.3333;.3334;.4333;.4334;1"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" path="M88 140C120 140 120 90 136 90" keyPoints="0;0;1;1" keyTimes="0;.6667;.7667;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6667;.6668;.7667;.7668;1"/>
    </circle>
  </g>
  <g class="dot" fill="#a78bfa">
    <circle r="3.5" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" path="M216 90h34" keyPoints="0;0;1;1" keyTimes="0;.1333;.2333;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.1333;.1334;.2333;.2334;1"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" path="M216 90C232 90 232 140 250 140" keyPoints="0;0;1;1" keyTimes="0;.4667;.5667;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.4667;.4668;.5667;.5668;1"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" path="M216 90C232 90 232 40 250 40" keyPoints="0;0;1;1" keyTimes="0;.8;.9;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.8;.8001;.9;.9001;1"/>
    </circle>
  </g>

  <g fill="#e2e8f0" text-anchor="middle">
    <text x="52" y="44">Images</text><text x="52" y="94">CSV</text><text x="52" y="144">BIDS</text>
    <text x="176" y="94" font-size="13">Dataset</text>
    <text x="279" y="44">PyTorch</text><text x="279" y="94">sklearn</text><text x="279" y="144">TF</text>
  </g>
</svg>
